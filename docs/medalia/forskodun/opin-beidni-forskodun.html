damáls sem þarf nánari sögu og skoðun.\n• Vandamálið þarf skoðun, til dæmis að hlusta á hjarta eða lungu, skoða eyru eða háls, þreifa á kvið eða meta áverka, hnút eða fyrirferð.\n• Þú vilt fá lyfseðil fyrir lyf sem þú færð skömmtuð í lyfjarúllu frá apóteki, eða breytingu á skömmtuninni.", "enableWhen": [{"question": "reg-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-gate", "type": "choice", "text": "Á eitthvað af ofangreindu við um erindið þitt?", "required": true, "answerOption": [{"valueCoding": {"code": "yes", "display": "Já"}}, {"valueCoding": {"code": "no", "display": "Nei"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}], "item": [{"linkId": "scope-gate-help", "type": "display", "text": "Viltu aðeins fá útskýringu á niðurstöðum sem þú hefur þegar fengið, eða endurnýjun á lyfi sem þú sækir í apótek? Það getum við gert. Svaraðu þá „Nei“.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}], "enableWhen": [{"question": "reg-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-stop", "type": "display", "text": "⛔ Við getum ekki afgreitt þetta erindi í fjarþjónustu.\n\nÞað er ekki vegna þess að erindið skipti ekki máli, heldur vegna þess að það þarf þjónustu sem ekki er hægt að veita skriflega. Merktu við hvað á við og þá sérðu hvert þú getur leitað.\n\nÞú þarft ekki að senda erindið. Ef þú merktir við þetta fyrir mistök, breyttu svarinu í „Nei“ til að halda áfram.", "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-which", "type": "choice", "text": "Hvað af þessu á við? Merktu við allt sem á við.", "required": true, "repeats": true, "answerOption": [{"valueCoding": {"code": "other-person", "display": "Erindið snýst um barn eða annan einstakling"}}, {"valueCoding": {"code": "lab-tests", "display": "Beiðni um blóðprufu eða aðra rannsókn"}}, {"valueCoding": {"code": "imaging", "display": "Beiðni um myndgreiningu eða speglun"}}, {"valueCoding": {"code": "referral", "display": "Tilvísun sem þarf nánari sögu og skoðun"}}, {"valueCoding": {"code": "exam", "display": "Vandamál sem þarf að skoða"}}, {"valueCoding": {"code": "dose-dispensed", "display": "Lyf í lyfjarúllu (lyfjaskömmtun)"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-other-person", "type": "display", "text": "Erindi fyrir aðra\n\nLæknir getur aðeins metið þann sem sendir erindið sjálfur, skráður inn með eigin rafrænum skilríkjum. Við getum ekki metið barn eða annan einstakling út frá lýsingu þinni.\n\n• Fullorðnir geta sent eigið erindi hingað.\n• Vegna barna: hafðu samband við heilsugæslu barnsins, eða hringdu í 1700 til að fá ráðgjöf.\n• Veikist barn skyndilega eða alvarlega: farðu á næstu bráðamóttöku eða hringdu í 112.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "other-person", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-lab-tests", "type": "display", "text": "Blóðprufur og aðrar rannsóknir\n\nVið biðjum ekki um rannsóknir í fjarþjónustu. Læknirinn sem biður um rannsókn ber ábyrgð á að fylgja niðurstöðunum eftir og það er best gert þar sem þú ert í reglulegri eftirfylgd.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Viltu aðeins fá útskýringu á niðurstöðum sem þú hefur þegar fengið? Það getum við gert. Breyttu þá svarinu hér fyrir ofan í „Nei“.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "lab-tests", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-imaging", "type": "display", "text": "Myndgreining og speglanir\n\nBeiðni um myndgreiningu eða speglun þarf að byggja á viðtali og skoðun, og niðurstöðunum þarf að fylgja eftir. Það er ekki hægt í skriflegri fjarþjónustu.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Eftir slys eða áverka: farðu á slysa- og bráðamóttöku.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "imaging", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-referral", "type": "display", "text": "Tilvísanir\n\nGóð tilvísun byggir á ítarlegri sögu og skoðun svo sérfræðingurinn fái þær upplýsingar sem hann þarf. Það getum við ekki veitt skriflega.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Fullorðnir geta oft bókað tíma beint hjá sérfræðilækni án tilvísunar.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "referral", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-exam", "type": "display", "text": "Vandamál sem þarf að skoða\n\nLæknirinn getur ekki hlustað, þreifað eða horft í eyru og háls í gegnum skriflegt erindi. Þegar skoðun ræður greiningunni er ekki öruggt að meta vandamálið hér.\n\n• Hafðu samband við heilsugæsluna þína.\n• Utan opnunartíma heilsugæslunnar: Læknavaktin, sími 1700.\n• Eftir slys eða áverka: farðu á slysa- og bráðamóttöku.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "exam", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-dose-dispensed", "type": "display", "text": "Lyf í lyfjarúllu\n\nSkömmtuð lyf eru afgreidd eftir skömmtunarkorti sem læknirinn þinn heldur utan um. Til að öll lyfin skili sér rétt í rúlluna þarf sá læknir að gera breytingarnar.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Apótekið sem skammtar lyfin getur leiðbeint þér um næstu skref.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "dose-dispensed", "display": "", "system": ""}}], "enableBehavior": "all"}], "enableBehavior": "all"}, {"linkId": "p3-flokkun", "type": "group", "text": "Um hvað snýst erindið?", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "cat-intro", "type": "display", "text": "Næstu tvær spurningar hjálpa lækninum að undirbúa sig áður en hann les lýsinguna þína."}, {"linkId": "erindi-type", "type": "choice", "text": "Hvers eðlis er erindið?", "required": true, "answerOption": [{"valueCoding": {"code": "new-problem", "display": "Nýtt einkenni eða nýtt heilsuvandamál"}}, {"valueCoding": {"code": "known-problem", "display": "Þekkt eða langvinnt vandamál sem hefur breyst eða versnað"}}, {"valueCoding": {"code": "medication", "display": "Lyf – endurnýjun, aukaverkun eða spurning"}}, {"valueCoding": {"code": "results", "display": "Niðurstöður úr rannsókn eða eftirfylgd"}}, {"valueCoding": {"code": "certificate", "display": "Vottorð eða staðfesting"}}, {"valueCoding": {"code": "other", "display": "Annað eða ég er ekki viss"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}], "item": [{"linkId": "erindi-type-help", "type": "disp "display": "Radio Button"}]}}]}, {"linkId": "bg-travel-where", "type": "string", "text": "Hvert ferðaðist þú og hvenær komst þú heim?", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "t.d. Taíland, kom heim 2. júní"}], "enableWhen": [{"question": "bg-travel", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "bg-height", "type": "quantity", "text": "Hæð", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-unit", "valueCoding": {"code": "cm", "display": "cm", "system": "http://unitsofmeasure.org"}}], "item": [{"linkId": "bg-height-help", "type": "display", "text": "Hæð og þyngd eru notaðar til að reikna örugga lyfjaskammta.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}]}, {"linkId": "bg-weight", "type": "quantity", "text": "Þyngd", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-unit", "valueCoding": {"code": "kg", "display": "kg", "system": "http://unitsofmeasure.org"}}]}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "no", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "p9-lysing", "type": "group", "text": "Lýstu vandamálinu með þínum eigin orðum", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "free-guide", "type": "display", "text": "Nú er komið að aðalatriðinu. Skrifaðu eins og þú værir að segja lækninum frá þessu í viðtali.\n\nReyndu að koma þessu að:\n\n1. Hvað er að og hvar á líkamanum?\n2. Hvenær byrjaði það og hvernig hefur það þróast síðan?\n3. Hvernig lýsir þetta sér nákvæmlega – hvernig lítur það út eða hvernig finnst þér það?\n4. Hvað gerir það betra eða verra?\n5. Hvað hefur þú gert við því hingað til?\n6. Hvað viltu helst fá út úr þessu erindi?\n\nÞað er engin þörf á að nota læknisfræðileg orð. Skrifaðu frekar of mikið en of lítið – læknirinn sér ekkert annað en það sem þú skrifar."}, {"linkId": "free-text", "type": "text", "text": "Lýsing á vandamálinu", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "Byrjaðu hér. Notaðu punktana að ofan sem leiðarvísi."}]}, {"linkId": "free-worry", "type": "text", "text": "Hvað hefur þú mestar áhyggjur af eða hvað óttast þú að þetta gæti verið?", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "Það er í lagi að segja það hreint út. Læknirinn svarar því sérstaklega."}], "item": [{"linkId": "free-worry-help", "type": "display", "text": "Þessi spurning er ekki formsatriði. Áhyggjur sjúklings eru oft besta vísbendingin um hvað þarf að útiloka.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}]}, {"linkId": "free-extra", "type": "text", "text": "Er eitthvað annað sem læknirinn ætti að vita?", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "t.d. eitthvað í fjölskyldunni, vinnuaðstæður, fyrri reynsla af meðferð. Þú mátt sleppa þessu."}]}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "no", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "p10-myndir", "type": "group", "text": "Myndir", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "img-gate", "type": "choice", "text": "Er eitthvað sýnilegt sem myndi hjálpa lækninum að sjá?", "required": true, "answerOption": [{"valueCoding": {"code": "yes", "display": "Já"}}, {"valueCoding": {"code": "no", "display": "Nei"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}], "item": [{"linkId": "img-gate-help", "type": "display", "text": "t.d. útbrot, sár, bólga, auga, nögl, lyfjapakkning eða niðurstöður úr rannsókn.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}]}, {"linkId": "img-tips", "type": "display", "text": "Svona verður myndin gagnleg:\n\n• Taktu myndina í góðri dagsbirtu, ekki með flassi.\n• Taktu tvær myndir: eina nærmynd og eina þar sem sést hvar á líkamanum þetta er.\n• Leggðu fingur eða mynt við hliðina svo stærðin sjáist.\n• Hreinsaðu krem eða farða af húðinni áður.\n• Ef þetta breytist dag frá degi, sendu líka eldri mynd ef þú átt hana.\n\nSendu ekki myndir sem sýna andlit eða kynfæri nema það sé nauðsynlegt fyrir matið.", "enableWhen": [{"question": "img-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "img-files", "type": "attachment", "text": "Hengdu myndir við hér", "repeats": true, "enableWhen": [{"question": "img-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "no", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "p11-lok", "type": "group", "text": "Væntingar og staðfesting", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "exp-wish", "type": "choice", "text": "Hverju vonast þú eftir frá þessu erindi?", "required": true, "repeats": true, "answerOption": [{"valueCoding": {"code": "advice", "display": "Mati og ráðgjöf um hvað ég á að gera"}}, {"valueCoding": {"code": "prescription", "display": "Lyfseðli"}}, {"valueCoding": {"code": "referral", "display": "Tilvísun til sérfræðings"}}, {"valueCoding": {"code": "certificate", "display": "Vottorði"}}, {"valueCoding": {"code": "unsure", "display": "Ég veit það ekki, ég vil bara láta meta þetta"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}], "item": [{"linkId": "exp-wish-help", "type": "display", "text": "Þetta hjálpar okkur að forðast misskilning. Læknirinn metur sjálfstætt hvað á við, en það er gott að vita hvað þú vonaðist eftir.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}]}, {"linkId": "contact-phone", "type": "string", "text": "Símanúmer sem má hringja í ef læknirinn þarf að ná í þig", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "t.d. 6XX XXXX"}]}, {"linkId": "final-intro", "type": "display", "text": "Að lokum, staðfestu eftirfarandi:"}, {"linkId": "final-truth", "type": "boolean", "text": "Upplýsingarnar sem ég hef gefið eru réttar eftir minni bestu vitund.", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}]}, {"linkId": "final-noexam", "type": "boolean", "text": "Ég skil að læknirinn getur ekki skoðað mig og getur því þurft að vísa mér í staðbundna skoðun eða hafna erindinu.", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}]}, {"linkId": "final-notemergency", "type": "boolean", "text": "Ég skil að þetta er ekki neyðarþjónusta og að svar berst innan tveggja klukkustunda á opnunartíma, alla daga milli 10 og 22.", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}]}, {"linkId": "final-privacy", "type": "boolean", "text": "Ég samþykki að Fjarlækningar vinni þessar heilsufarsupplýsingar í samræmi við persónuverndarstefnu félagsins.", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}]}, {"linkId": "final-thanks", "type": "display", "text": "Takk fyrir. Erindið fer nú til læknis sem les það og svarar þér. Ef ástand þitt versnar á meðan þú bíður, hringdu í 1700 eða 112."}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "no", "display": "", "system": ""}}], "enableBehavior": "all"}]}</script>
<script type="application/json" id="q-short">{"resourceType": "Questionnaire", "status": "active", "title": "Opin beiðni – stutt útgáfa", "name": "OpinBeidniStutt", "description": "Stutt útgáfa opna erindaflokksins. Öryggisskimun, frjáls texti með leiðarvísi, og aðeins þær skipulögðu spurningar sem myndu annars kalla á aukafyrirspurn frá lækni.", "subjectType": ["Patient"], "extension": [{"url": "https://medalia.dev/fhir/extensions/1.0/questionnaire-help-display-mode", "valueCode": "inline"}], "useContext": [{"code": {"code": "workflow", "display": "Workflow Setting", "system": "http://terminology.hl7.org/CodeSystem/usage-context-type"}, "valueCodeableConcept": {"coding": [{"code": "patient-questionnaire", "display": "Patient questionnaire", "system": "https://medalia.dev/fhir/CodeSystem/questionnaire-contexts"}]}}], "item": [{"linkId": "p1-fyrirvari", "type": "group", "text": "Áður en þú byrjar", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "intro-all", "type": "display", "text": "Þú lýsir vandamálinu, læknir les og svarar þér skriflega innan tveggja klukkustunda á opnunartíma, alla daga milli 10 og 22. Læknirinn getur ekki skoðað þig og gæti því vísað þér í skoðun eða hafnað erindinu. Ekki er ávísað ávana- og fíknilyfjum í fjarþjónustu.\n\n⚠️ Þetta er ekki neyðarþjónusta. Hringdu í 112 vegna bráðra veikinda eða slysa, 1700 til að fá ráðgjöf strax, 543 2222 vegna eitrunar.\n\n[GJALDSKRÁ – t.d. Gjald fyrir erindið er X kr.]\n\nLæknirinn sér aðeins það sem þú skrifar hér."}, {"linkId": "intro-ack", "type": "boolean", "text": "Ég hef lesið ofangreint og skil að þetta er ekki neyðarþjónusta.", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}]}], "enableBehavior": "all"}, {"linkId": "p2-oryggisskimun", "type": "group", "text": "Öryggisskimun", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "rf-intro", "type": "display", "text": "Lestu listann og svaraðu svo spurningunni fyrir neðan:\n\n• Verkur eða þyngsli fyrir brjósti\n• Andþyngsli eða öndunarerfiðleikar í hvíld\n• Skyndilegt máttleysi, dofi, talörðugleikar eða sjónskerðing\n• Skyndilegur og mjög mikill höfuðverkur, ólíkur öllu fyrri\n• Meðvitundarleysi, yfirlið eða rugl\n• Miklir eða vaxandi kviðverkir\n• Blóð í uppköstum, svartar eða blóðugar hægðir\n• Hiti með stífum hnakka, ljósfælni eða útbrotum sem hverfa ekki við þrýsting\n• Bólga í andliti, vörum eða tungu eftir lyf, fæðu eða stungu\n• Blæðing eða verkir á meðgöngu\n• Alvarlegur áverki eða mikil blæðing\n• Sjálfsvígshugsanir eða hugsanir um að skaða þig eða aðra"}, {"linkId": "rf-gate", "type": "choice", "text": "Á eitthvað af ofangreindu við um þig núna?", "required": true, "answerOption": [{"valueCoding": {"code": "yes", "display": "Já"}}, {"valueCoding": {"code": "no", "display": "Nei"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}]}, {"linkId": "rf-which", "type": "choice", "text": "Hvað af þessu á við?", "repeats": true, "answerOption": [{"valueCoding": {"code": "chest", "display": "Verkur eða þyngsli fyrir brjósti"}}, {"valueCoding": {"code": "breathing", "display": "Andþyngsli eða öndunarerfiðleikar"}}, {"valueCoding": {"code": "stroke", "display": "Máttleysi, dofi, talörðugleikar eða sjónskerðing"}}, {"valueCoding": {"code": "headache", "display": "Skyndilegur og mjög mikill höfuðverkur"}}, {"valueCoding": {"code": "consciousness", "display": "Meðvitundarleysi, yfirlið eða rugl"}}, {"valueCoding": {"code": "abdomen", "display": "Miklir kviðverkir"}}, {"valueCoding": {"code": "bleeding-gi", "display": "Blóð í uppköstum eða hægðum"}}, {"valueCoding": {"code": "meningitis", "display": "Hiti með stífum hnakka eða útbrotum"}}, {"valueCoding": {"code": "anaphylaxis", "display": "Bólga í andliti eða tungu, bráðaofnæmi"}}, {"valueCoding": {"code": "pregnancy", "display": "Blæðing eða verkir á meðgöngu"}}, {"valueCoding": {"code": "trauma", "display": "Alvarlegur áverki eða mikil blæðing"}}, {"valueCoding": {"code": "self-harm", "display": "Sjálfsvígshugsanir"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}], "enableWhen": [{"question": "rf-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "rf-warning", "type": "display", "text": "⚠️ Stöðvaðu hér og leitaðu aðstoðar strax.\n\nHringdu í 112 ef ástandið er brátt, 1700 til að fá ráðgjöf strax, eða farðu á næstu bráðamóttöku. Sjálfsvígshugsanir: 1717 eða 112.\n\nÞú mátt senda erindið samt, en það kemur ekki í stað bráðaþjónustu.", "enableWhen": [{"question": "rf-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "rf-ack", "type": "boolean", "text": "Ég skil að ég á að hafa samband við 112 eða 1700 og að þetta erindi kemur ekki í stað bráðaþjónustu.", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}], "enableWhen": [{"question": "rf-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}], "enableBehavior": "all"}, {"linkId": "p-hentar", "type": "group", "text": "Hentar erindið fjarþjónustu?", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "reg-gate", "type": "choice", "text": "Ertu með skráningu á heilsugæslu þar sem þjónustan er í boði?", "required": true, "answerOption": [{"valueCoding": {"code": "yes", "display": "Já"}}, {"valueCoding": {"code": "no", "display": "Nei"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}], "item": [{"linkId": "reg-gate-help", "type": "display", "text": "Þjónustan er enn sem komið er aðeins í boði fyrir fólk sem er skráð á: Heilsugæslan í Vestmannaeyjum. Ertu ekki viss? Þú sérð skráninguna þína á Mínum síðum á island.is.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}]}, {"linkId": "reg-stop", "type": "display", "text": "⛔ Þjónustan er ekki enn opin á þinni heilsugæslu.\n\nFjarlækningar opna fyrir þjónustuna eina heilsugæslu í einu og fleiri heilsugæslur á Suðurlandi bætast við á næstunni. Þangað til skaltu hafa samband við heilsugæsluna þína, eða hringja í 1700 ef þú þarft ráð strax.\n\nÞú þarft ekki að senda erindið. Ef þú merktir við þetta fyrir mistök, breyttu svarinu í „Já“ til að halda áfram.", "enableWhen": [{"question": "reg-gate", "operator": "=", "answerCoding": {"code": "no", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-intro", "type": "display", "text": "Sumt er ekki hægt að leysa í skriflegri fjarþjónustu, sama hversu vel því er lýst. Lestu listann og svaraðu svo spurningunni fyrir neðan. Þannig sparar þú þér bið eftir svari sem getur ekki hjálpað þér.\n\n• Erindið snýst um einhvern annan en þig, til dæmis barnið þitt, maka eða foreldri.\n• Þú vilt fá beiðni um blóðprufu eða aðra rannsókn, til dæmis þvag- eða hormónamælingu.\n• Þú vilt fá beiðni um myndgreiningu (röntgen, tölvusneiðmynd, segulómun eða ómun) eða speglun (til dæmis maga- eða ristilspeglun).\n• Þú vilt fá tilvísun til sérfræðings vegna vandamáls sem þarf nánari sögu og skoðun.\n• Vandamálið þarf skoðun, til dæmis að hlusta á hjarta eða lungu, skoða eyru eða háls, þreifa á kvið eða meta áverka, hnút eða fyrirferð.\n• Þú vilt fá lyfseðil fyrir lyf sem þú færð skömmtuð í lyfjarúllu frá apóteki, eða breytingu á skömmtuninni.", "enableWhen": [{"question": "reg-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-gate", "type": "choice", "text": "Á eitthvað af ofangreindu við um erindið þitt?", "required": true, "answerOption": [{"valueCoding": {"code": "yes", "display": "Já"}}, {"valueCoding": {"code": "no", "display": "Nei"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}], "item": [{"linkId": "scope-gate-help", "type": "display", "text": "Viltu aðeins fá útskýringu á niðurstöðum sem þú hefur þegar fengið, eða endurnýjun á lyfi sem þú sækir í apótek? Það getum við gert. Svaraðu þá „Nei“.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}], "enableWhen": [{"question": "reg-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-stop", "type": "display", "text": "⛔ Við getum ekki afgreitt þetta erindi í fjarþjónustu.\n\nÞað er ekki vegna þess að erindið skipti ekki máli, heldur vegna þess að það þarf þjónustu sem ekki er hægt að veita skriflega. Merktu við hvað á við og þá sérðu hvert þú getur leitað.\n\nÞú þarft ekki að senda erindið. Ef þú merktir við þetta fyrir mistök, breyttu svarinu í „Nei“ til að halda áfram.", "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-which", "type": "choice", "text": "Hvað af þessu á við? Merktu við allt sem á við.", "required": true, "repeats": true, "answerOption": [{"valueCoding": {"code": "other-person", "display": "Erindið snýst um barn eða annan einstakling"}}, {"valueCoding": {"code": "lab-tests", "display": "Beiðni um blóðprufu eða aðra rannsókn"}}, {"valueCoding": {"code": "imaging", "display": "Beiðni um myndgreiningu eða speglun"}}, {"valueCoding": {"code": "referral", "display": "Tilvísun sem þarf nánari sögu og skoðun"}}, {"valueCoding": {"code": "exam", "display": "Vandamál sem þarf að skoða"}}, {"valueCoding": {"code": "dose-dispensed", "display": "Lyf í lyfjarúllu (lyfjaskömmtun)"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "check-box", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Check Box"}]}}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "yes", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-other-person", "type": "display", "text": "Erindi fyrir aðra\n\nLæknir getur aðeins metið þann sem sendir erindið sjálfur, skráður inn með eigin rafrænum skilríkjum. Við getum ekki metið barn eða annan einstakling út frá lýsingu þinni.\n\n• Fullorðnir geta sent eigið erindi hingað.\n• Vegna barna: hafðu samband við heilsugæslu barnsins, eða hringdu í 1700 til að fá ráðgjöf.\n• Veikist barn skyndilega eða alvarlega: farðu á næstu bráðamóttöku eða hringdu í 112.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "other-person", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-lab-tests", "type": "display", "text": "Blóðprufur og aðrar rannsóknir\n\nVið biðjum ekki um rannsóknir í fjarþjónustu. Læknirinn sem biður um rannsókn ber ábyrgð á að fylgja niðurstöðunum eftir og það er best gert þar sem þú ert í reglulegri eftirfylgd.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Viltu aðeins fá útskýringu á niðurstöðum sem þú hefur þegar fengið? Það getum við gert. Breyttu þá svarinu hér fyrir ofan í „Nei“.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "lab-tests", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-imaging", "type": "display", "text": "Myndgreining og speglanir\n\nBeiðni um myndgreiningu eða speglun þarf að byggja á viðtali og skoðun, og niðurstöðunum þarf að fylgja eftir. Það er ekki hægt í skriflegri fjarþjónustu.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Eftir slys eða áverka: farðu á slysa- og bráðamóttöku.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "imaging", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-referral", "type": "display", "text": "Tilvísanir\n\nGóð tilvísun byggir á ítarlegri sögu og skoðun svo sérfræðingurinn fái þær upplýsingar sem hann þarf. Það getum við ekki veitt skriflega.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Fullorðnir geta oft bókað tíma beint hjá sérfræðilækni án tilvísunar.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "referral", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-exam", "type": "display", "text": "Vandamál sem þarf að skoða\n\nLæknirinn getur ekki hlustað, þreifað eða horft í eyru og háls í gegnum skriflegt erindi. Þegar skoðun ræður greiningunni er ekki öruggt að meta vandamálið hér.\n\n• Hafðu samband við heilsugæsluna þína.\n• Utan opnunartíma heilsugæslunnar: Læknavaktin, sími 1700.\n• Eftir slys eða áverka: farðu á slysa- og bráðamóttöku.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "exam", "display": "", "system": ""}}], "enableBehavior": "all"}, {"linkId": "scope-why-dose-dispensed", "type": "display", "text": "Lyf í lyfjarúllu\n\nSkömmtuð lyf eru afgreidd eftir skömmtunarkorti sem læknirinn þinn heldur utan um. Til að öll lyfin skili sér rétt í rúlluna þarf sá læknir að gera breytingarnar.\n\n• Hafðu samband við heilsugæsluna þína eða heimilislækni.\n• Apótekið sem skammtar lyfin getur leiðbeint þér um næstu skref.", "enableWhen": [{"question": "scope-which", "operator": "=", "answerCoding": {"code": "dose-dispensed", "display": "", "system": ""}}], "enableBehavior": "all"}], "enableBehavior": "all"}, {"linkId": "p3-erindid", "type": "group", "text": "Hvað er að?", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "page", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Page"}]}}], "item": [{"linkId": "erindi-type", "type": "choice", "text": "Hvers eðlis er erindið?", "required": true, "answerOption": [{"valueCoding": {"code": "new-problem", "display": "Nýtt einkenni eða nýtt heilsuvandamál"}}, {"valueCoding": {"code": "known-problem", "display": "Þekkt vandamál sem hefur breyst eða versnað"}}, {"valueCoding": {"code": "medication", "display": "Lyf – endurnýjun, aukaverkun eða spurning"}}, {"valueCoding": {"code": "results", "display": "Niðurstöður úr rannsókn eða eftirfylgd"}}, {"valueCoding": {"code": "certificate", "display": "Vottorð eða staðfesting"}}, {"valueCoding": {"code": "other", "display": "Annað eða ég er ekki viss"}}], "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "radio-button", "system": "http://hl7.org/fhir/questionnaire-item-control", "display": "Radio Button"}]}}]}, {"linkId": "free-guide", "type": "display", "text": "Skrifaðu eins og þú værir að segja lækninum frá þessu. Reyndu að koma þessu að:\n\n1. Hvað er að og hvar á líkamanum?\n2. Hvenær byrjaði það, byrjaði það skyndilega, og gerðist eitthvað sérstakt á undan?\n3. Hvernig lýsir þetta sér — hvernig lítur það út eða hvernig finnst þér það?\n4. Hvað gerir það betra eða verra?\n5. Hvað hefur þú prófað sjálf eða sjálfur og virkaði það?\n6. Hefur þú fengið þetta áður og hvað var gert þá?\n\nEngin þörf á læknisfræðilegum orðum. Skrifaðu frekar of mikið en of lítið."}, {"linkId": "free-text", "type": "text", "text": "Lýsing á vandamálinu", "required": true, "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "Byrjaðu hér. Notaðu punktana að ofan sem leiðarvísi."}]}, {"linkId": "free-worry", "type": "text", "text": "Hvað hefur þú mestar áhyggjur af eða hvað óttast þú að þetta gæti verið?", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/entryFormat", "valueString": "Það er í lagi að segja það hreint út. Læknirinn svarar því sérstaklega."}], "item": [{"linkId": "free-worry-help", "type": "display", "text": "Áhyggjur sjúklings eru oft besta vísbendingin um hvað þarf að útiloka.", "extension": [{"url": "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl", "valueCodeableConcept": {"coding": [{"code": "help", "system": "http://hl7.org/fhir/questionnaire-item-control"}]}}]}]}], "enableWhen": [{"question": "scope-gate", "operator": "=", "answerCoding": {"code": "no", "display": "", "system": ""}}], "enableBehavior": "a   };
  const CTRL = "http://hl7.org/fhir/StructureDefinition/questionnaire-itemControl";
  const ENTRY = "http://hl7.org/fhir/StructureDefinition/entryFormat";
  const UNIT = "http://hl7.org/fhir/StructureDefinition/questionnaire-unit";
  const MIN = "http://hl7.org/fhir/StructureDefinition/minValue";
  const MAX = "http://hl7.org/fhir/StructureDefinition/maxValue";

  let version = "long";
  let answers = {};     // linkId -> string | string[] | boolean | number
  let pageIdx = 0;
  let done = false;
  const card = document.getElementById("card");

  const ext = (it, url) => (it.extension || []).find((e) => e.url === url);
  const ctrl = (it) => { const e = ext(it, CTRL); return e ? e.valueCodeableConcept.coding[0].code : null; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function index(q) {
    const all = {};
    (function walk(items, parent) { for (const it of items || []) { all[it.linkId] = { it, parent }; walk(it.item, it.linkId); } })(q.item);
    return all;
  }
  let ALL = index(Q[version]);

  // FHIR: a disabled item counts as unanswered, so a condition on it is false.
  function enabled(linkId, seen = new Set()) {
    const node = ALL[linkId];
    if (!node) return false;
    if (seen.has(linkId)) return true;
    seen.add(linkId);
    if (node.parent && !enabled(node.parent, seen)) return false;
    const ew = node.it.enableWhen || [];
    if (!ew.length) return true;
    const test = (e) => {
      if (!enabled(e.question, new Set(seen))) return false;
      const a = answers[e.question];
      const code = e.answerCoding && e.answerCoding.code;
      if (Array.isArray(a)) return a.includes(code);
      return a === code;
    };
    return node.it.enableBehavior === "any" ? ew.some(test) : ew.every(test);
  }

  const pages = () => Q[version].item.filter((p) => p.type === "group");
  const livePages = () => pages().filter((p) => enabled(p.linkId));

  function condText(it) {
    const ew = it.enableWhen || [];
    if (!ew.length) return "";
    const join = it.enableBehavior === "any" ? " EÐA " : " OG ";
    return ew.map((e) => {
      const target = ALL[e.question] && ALL[e.question].it;
      const opt = target && (target.answerOption || []).find((o) => o.valueCoding.code === e.answerCoding.code);
      return `${e.question} = „${opt ? opt.valueCoding.display : e.answerCoding.code}“`;
    }).join(join);
  }
  function logicLine(it) {
    const c = condText(it);
    return `<div class="logic"><b>${esc(it.linkId)}</b> · ${esc(it.type)}${it.repeats ? " · fjölval" : ""}${c ? " · birtist ef " + esc(c) : ""}</div>`;
  }

  function isAnswered(it) {
    const a = answers[it.linkId];
    if (it.type === "boolean") return a === true;
    if (Array.isArray(a)) return a.length > 0;
    return a !== undefined && a !== null && String(a).trim() !== "";
  }

  function renderItem(it) {
    if (!enabled(it.linkId)) return "";
    if (ctrl(it) === "help") return "";
    const help = (it.item || []).filter((c) => ctrl(c) === "help").map((c) => `<p class="help">${esc(c.text)}</p>`).join("");
    if (it.type === "display") {
      const t = it.text || "";
      const cls = t.startsWith("⛔") ? "stop" : t.startsWith("⚠️") ? "warn" : "";
      return `<div class="q">${logicLine(it)}<div class="display ${cls}">${esc(t)}</div></div>`;
    }
    const req = it.required ? '<span class="req" aria-hidden="true">*</span>' : "";
    const id = "f-" + it.linkId;
    let field = "";
    const a = answers[it.linkId];
    const ph = ext(it, ENTRY) ? ` placeholder="${esc(ext(it, ENTRY).valueString)}"` : "";
    if (it.type === "choice") {
      const opts = it.answerOption || [];
      if (ctrl(it) === "drop-down" && !it.repeats) {
        field = `<select id="${id}" data-l="${esc(it.linkId)}" data-k="select"><option value="">Veldu…</option>${opts.map((o) => `<option value="${esc(o.valueCoding.code)}"${a === o.valueCoding.code ? " selected" : ""}>${esc(o.valueCoding.display)}</option>`).join("")}</select>`;
      } else {
        const multi = !!it.repeats;
        field = `<div class="opts" role="${multi ? "group" : "radiogroup"}" aria-labelledby="${id}-l">${opts.map((o, i) => {
          const c = o.valueCoding.code;
          const on = multi ? Array.isArray(a) && a.includes(c) : a === c;
          return `<label class="opt"><input type="${multi ? "checkbox" : "radio"}" id="${id}-${i}" name="${id}" value="${esc(c)}" data-l="${esc(it.linkId)}" data-k="${multi ? "multi" : "single"}"${on ? " checked" : ""}><span>${esc(o.valueCoding.display)}</span></label>`;
        }).join("")}</div>`;
      }
    } else if (it.type === "boolean") {
      return `<div class="q" data-q="${esc(it.linkId)}">${logicLine(it)}<label class="opt"><input type="checkbox" id="${id}" data-l="${esc(it.linkId)}" data-k="bool"${a === true ? " checked" : ""}><span>${esc(it.text)}${req}</span></label>${help}</div>`;
    } else if (it.type === "text") {
      field = `<textarea id="${id}" data-l="${esc(it.linkId)}" data-k="text"${ph}>${esc(a || "")}</textarea>`;
    } else if (it.type === "string") {
      field = `<input type="text" id="${id}" data-l="${esc(it.linkId)}" data-k="text" value="${esc(a || "")}"${ph}>`;
    } else if (it.type === "quantity") {
      const u = ext(it, UNIT);
      field = `<div class="unit"><input type="number" inputmode="decimal" step="any" id="${id}" data-l="${esc(it.linkId)}" data-k="text" value="${esc(a || "")}"><span>${esc(u ? u.valueCoding.display : "")}</span></div>`;
    } else if (it.type === "integer") {
      const lo = ext(it, MIN) ? ext(it, MIN).valueInteger : 0, hi = ext(it, MAX) ? ext(it, MAX).valueInteger : 10;
      let b = ""; for (let n = lo; n <= hi; n++) b += `<button type="button" data-l="${esc(it.linkId)}" data-k="int" data-v="${n}" aria-pressed="${a === n}">${n}</button>`;
      field = `<div class="scale" role="group" aria-labelledby="${id}-l">${b}</div>`;
    } else if (it.type === "attachment") {
      field = `<input type="file" id="${id}" data-l="${esc(it.linkId)}" data-k="file" accept="image/*" multiple>${a ? `<p class="help">${esc(a)}</p>` : ""}`;
    }
    return `<div class="q" data-q="${esc(it.linkId)}">${logicLine(it)}<label class="qt" id="${id}-l" for="${id}">${esc(it.text)}${req}</label>${help}${field}</div>`;
  }

  function render() {
    ALL = index(Q[version]);
    const live = livePages();
    if (done) return renderSummary(live);
    if (pageIdx >= live.length) pageIdx = live.length - 1;
    const p = live[pageIdx];
    // Position among ALL pages (as numbered in the Word file); hidden pages are skipped.
    const allPages = pages(); const pos = allPages.indexOf(p) + 1;
    const pct = Math.round((pos / allPages.length) * 100);
    card.innerHTML = `
      <div class="card-head">
        <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <div class="eyebrow">Síða ${pos} af ${allPages.length}</div>
        ${logicLine(p)}
        <h2>${esc(p.text)}</h2>
      </div>
      <div class="items">${(p.item || []).map(renderItem).join("")}</div>
      <div class="nav">
        <button type="button" class="btn" id="back"${pageIdx === 0 ? " disabled" : ""}>Til baka</button>
        <button type="button" class="btn primary" id="next">${pageIdx === live.length - 1 ? "Senda erindi" : "Áfram"}</button>
      </div>`;
  }

  function missing(p) {
    const miss = [];
    (function walk(items) { for (const it of items || []) {
      if (!enabled(it.linkId) || ctrl(it) === "help") continue;
      if (it.required && it.type !== "display" && it.type !== "group" && !isAnswered(it)) miss.push(it.linkId);
      walk(it.item);
    } })(p.item);
    return miss;
  }

  function renderSummary(live) {
    const rows = [];
    for (const p of live) {
      const items = [];
      (function walk(list) { for (const it of list || []) {
        if (!enabled(it.linkId) || it.type === "display" || ctrl(it) === "help") continue;
        if (it.type !== "group" && isAnswered(it)) {
          let v = answers[it.linkId];
          const byCode = (c) => { const o = (it.answerOption || []).find((x) => x.valueCoding.code === c); return o ? o.valueCoding.display : c; };
          if (it.type === "choice") v = Array.isArray(v) ? v.map(byCode).join("\n") : byCode(v);
          if (it.type === "boolean") v = "Já";
          const u = ext(it, UNIT); if (u) v = v + " " + u.valueCoding.display;
          items.push(`<dt>${esc(it.text)}</dt><dd>${esc(v)}</dd>`);
        }
        walk(it.item);
      } })(p.item);
      if (items.length) rows.push(`<h3>${esc(p.text)}</h3><dl>${items.join("")}</dl>`);
    }
    const stopped = enabled("reg-stop") || enabled("scope-stop");
    card.innerHTML = `
      <div class="card-head"><div class="eyebrow">Svona berst erindið lækninum</div><h2>Samantekt svara</h2></div>
      <div class="summary">
        <p>${stopped ? '<span class="pill stop">Stöðvað á skimun</span> Erindið færi til læknis með aðeins skimunarsvörunum, og þær síður sem á eftir koma voru faldar.' : '<span class="pill">Tilbúið til sendingar</span> Í raunverulegri gátt færi þetta til læknis.'}</p>
        ${rows.join("") || "<p>Engin svör.</p>"}
      </div>
      <div class="nav"><button type="button" class="btn" id="edit">Breyta svörum</button><button type="button" class="btn primary" id="restart">Byrja upp á nýtt</button></div>`;
  }

  // Answers — re-render so conditions apply immediately, keeping focus sane.
  card.addEventListener("change", (e) => {
    const el = e.target, l = el.dataset.l, k = el.dataset.k;
    if (!l) return;
    if (k === "single" || k === "select") answers[l] = el.value || undefined;
    else if (k === "multi") { const cur = new Set(answers[l] || []); el.checked ? cur.add(el.value) : cur.delete(el.value); answers[l] = [...cur]; }
    else if (k === "bool") answers[l] = el.checked;
    else if (k === "file") answers[l] = [...el.files].map((f) => f.name).join(", ");
    else return;
    const keep = el.id; render(); const again = document.getElementById(keep); if (again) again.focus({ preventScroll: true });
  });
  card.addEventListener("input", (e) => {
    const el = e.target; if (el.dataset.k === "text") answers[el.dataset.l] = el.value;
  });
  card.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k === "int") { answers[b.dataset.l] = Number(b.dataset.v); render(); return; }
    if (b.id === "back") { pageIdx = Math.max(0, pageIdx - 1); render(); scrollTo(0, 0); }
    if (b.id === "next") {
      const live = livePages(); const miss = missing(live[pageIdx]);
      document.querySelectorAll(".q.err").forEach((n) => { n.classList.remove("err"); n.querySelector(".errmsg")?.remove(); });
      if (miss.length) {
        miss.forEach((id) => { const n = card.querySelector(`[data-q="${CSS.escape(id)}"]`); if (n) { n.classList.add("err"); n.insertAdjacentHTML("beforeend", '<div class="errmsg">Þessu þarf að svara.</div>'); } });
        card.querySelector(".q.err")?.scrollIntoView({ block: "center", behavior: "smooth" });
        return;
      }
      if (pageIdx === live.length - 1) done = true; else pageIdx++;
      render(); scrollTo(0, 0);
    }
    if (b.id === "edit") { done = false; render(); }
    if (b.id === "restart") { answers = {}; pageIdx = 0; done = false; render(); scrollTo(0, 0); }
  });

  function setVersion(v) {
    version = v; answers = {}; pageIdx = 0; done = false;
    document.getElementById("v-long").setAttribute("aria-pressed", v === "long");
    document.getElementById("v-short").setAttribute("aria-pressed", v === "short");
    render();
  }
  document.getElementById("v-long").onclick = () => setVersion("long");
  document.getElementById("v-short").onclick = () => setVersion("short");
  const logic = document.getElementById("show-logic");
  logic.onchange = () => document.getElementById("app").classList.toggle("show-logic", logic.checked);

  render();
})();
</script>
