<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a2318"/><stop offset="0.5" stop-color="#e0502a"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="1200" cy="460" r="620"><stop offset="0" stop-color="#fff0a0"/><stop offset="0.4" stop-color="#ffb347" stop-opacity="0.7"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <linearGradient id="rockTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1420"/><stop offset="1" stop-color="#4a2a34"/></linearGradient>
    <linearGradient id="rockBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2a34"/><stop offset="1" stop-color="#1e1420"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e1420"/><stop offset="1" stop-color="#4a2a38"/></linearGradient>
    <linearGradient id="whaleBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f1f7fc"/><stop offset="1" stop-color="#c9dcec"/></linearGradient>
    <linearGradient id="whaleFin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#bcd2e6"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#tunnel)"/>
  <!-- the light ahead -->
  <g data-anim="pulse">
    <circle cx="1200" cy="460" r="620" fill="url(#light)"/>
  </g>
  <!-- back wall ribs -->
  <path d="M520 150 C560 300 560 620 520 760 M760 150 C810 300 810 620 760 760 M980 150 C1040 300 1040 620 980 760" fill="none" stroke="#7a1414" stroke-width="26" stroke-linecap="round" opacity="0.14"/>
  <!-- tunnel roof and floor -->
  <path d="M300 0 L1200 0 L1200 120 C1110 170 1050 100 960 146 C880 190 820 110 740 150 C660 186 600 116 520 152 C440 176 380 130 300 160 Z" fill="url(#rockTop)"/>
  <path d="M300 900 L1200 900 L1200 790 C1110 740 1040 800 960 770 C880 730 810 800 730 770 C650 736 590 796 510 764 C440 742 380 780 300 750 Z" fill="url(#rockBot)"/>
  <path d="M1200 790 C1110 740 1040 800 960 770 C880 730 810 800 730 770 C650 736 590 796 510 764 C440 742 380 780 300 750 L300 764 C380 794 440 758 510 780 C590 812 650 752 730 786 C810 816 880 746 960 786 C1040 816 1110 756 1200 806 Z" fill="#ff9a3c" opacity="0.5"/>
  <!-- eyes in a crevice -->
  <ellipse cx="930" cy="78" rx="52" ry="26" fill="#120b14"/>
  <g data-anim="blink" data-tap="hide">
    <circle cx="914" cy="78" r="12" fill="#fff6c8"/>
    <circle cx="948" cy="78" r="12" fill="#fff6c8"/>
    <circle cx="910" cy="82" r="5" fill="#1d2b3a"/>
    <circle cx="944" cy="82" r="5" fill="#1d2b3a"/>
  </g>
  <!-- little cave shrimp, staring -->
  <g data-anim="swim" data-tap="hide">
    <path d="M1010 640 C1010 610 1050 600 1076 616 C1100 632 1096 664 1070 668 C1090 650 1070 632 1050 640 C1036 646 1030 652 1010 640 Z" fill="#ff8fa6"/>
    <path d="M1070 668 L1092 684 L1064 686 Z" fill="#f06a88"/>
    <path d="M1016 622 C1000 600 980 596 962 600 M1018 628 C996 616 976 620 964 630" fill="none" stroke="#f06a88" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1026" cy="626" r="9" fill="#ffffff"/>
    <circle cx="1023" cy="627" r="4" fill="#1d2b3a"/>
  </g>
  <!-- bubbles -->
  <g data-anim="float">
    <circle cx="880" cy="300" r="15" fill="#fff0c8" opacity="0.4"/>
    <circle cx="875" cy="295" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="920" cy="250" r="9" fill="#fff0c8" opacity="0.4"/>
    <circle cx="1090" cy="400" r="11" fill="#fff0c8" opacity="0.4"/>
    <circle cx="1120" cy="350" r="6" fill="#fff0c8" opacity="0.4"/>
  </g>
  <!-- hero: front half, stuck -->
  <g transform="translate(-344 -103) scale(1.15)">
    <g data-anim="wiggle" data-tap="wiggle">
      <path d="M300 468 C330 400 430 318 600 300 C790 280 965 350 1010 470 C1045 565 965 660 790 680 C610 700 420 650 330 540 C310 515 298 492 300 468 Z" fill="url(#whaleBody)"/>
      <path d="M350 560 C450 640 620 680 790 664 C900 652 975 610 1000 555 C985 640 900 690 780 700 C610 714 430 660 350 560 Z" fill="#b9cfe3" opacity="0.75"/>
      <path d="M520 648 C600 668 700 672 790 660" fill="none" stroke="#a9c2d9" stroke-width="5" stroke-linecap="round"/>
      <path d="M560 622 C640 640 730 642 815 630" fill="none" stroke="#a9c2d9" stroke-width="5" stroke-linecap="round"/>
      <path d="M840 590 C820 650 780 700 720 725 C705 700 720 650 760 610 C785 588 815 580 840 590 Z" fill="url(#whaleFin)"/>
      <ellipse cx="700" cy="298" rx="16" ry="6" fill="#9db7cf"/>
      <ellipse cx="912" cy="530" rx="50" ry="36" fill="#f8b9c6" opacity="0.9"/>
      <g data-anim="blink">
        <circle cx="874" cy="436" r="44" fill="#e3edf6"/>
        <circle cx="876" cy="434" r="41" fill="#ffffff"/>
        <circle cx="858" cy="446" r="23" fill="#1d2b3a"/>
        <circle cx="866" cy="436" r="8" fill="#ffffff"/>
      </g>
      <path d="M832 392 C856 368 892 354 926 356" fill="none" stroke="#7d97b0" stroke-width="8" stroke-linecap="round"/>
      <path d="M938 594 C950 582 960 600 972 590 C984 580 994 598 1006 584" fill="none" stroke="#3a5068" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M760 352 C752 336 762 324 768 314 C776 326 784 338 776 352 C772 358 764 358 760 352 Z" fill="#a8dcff"/>
      <path d="M800 330 C794 318 802 308 806 300 C812 310 818 320 812 330 C810 334 802 334 800 330 Z" fill="#a8dcff"/>
    </g>
  </g>
  <!-- rumble lines round the tummy -->
  <g data-anim="pulse" data-tap="grow">
    <path d="M372 540 C388 556 388 584 372 600 M476 540 C460 556 460 584 476 600 M506 524 C480 550 480 590 506 616" fill="none" stroke="#ff9a3c" stroke-width="9" stroke-linecap="round"/>
    <path d="M402 546 L416 560 L402 574 L416 588 M432 546 L446 560 L432 574 L446 588" fill="none" stroke="#f0703a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- the rock that holds him -->
  <path d="M0 0 L330 0 C350 90 310 170 352 232 C376 262 354 292 322 304 C296 340 290 420 296 470 C290 540 300 606 326 644 C358 660 376 690 350 720 C312 780 350 850 330 900 L0 900 Z" fill="url(#wall)"/>
  <path d="M330 0 C350 90 310 170 352 232 C376 262 354 292 322 304 C296 340 290 420 296 470 C290 540 300 606 326 644 C358 660 376 690 350 720 C312 780 350 850 330 900 L312 900 C330 850 294 780 330 722 C352 692 340 672 310 656 C282 610 272 540 278 470 C272 420 280 336 306 292 C336 282 354 262 334 236 C292 170 332 90 312 0 Z" fill="#e0502a" opacity="0.6"/>
  <path d="M60 200 L150 170 L200 240 L100 280 Z M40 560 L140 530 L190 610 L90 650 Z" fill="#5a3444" opacity="0.4"/>
  <!-- squeeze marks -->
  <path d="M392 196 L410 168 M430 214 L456 192 M392 760 L410 788 M430 742 L456 764" fill="none" stroke="#fff0a0" stroke-width="7" stroke-linecap="round"/>
  <!-- pebbles shaken loose -->
  <g data-anim="bob">
    <circle cx="470" cy="204" r="9" fill="#2c1a24"/>
    <circle cx="500" cy="232" r="6" fill="#2c1a24"/>
    <circle cx="446" cy="246" r="5" fill="#2c1a24"/>
  </g>
</svg>
