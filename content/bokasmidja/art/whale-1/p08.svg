      <ellipse cx="958" cy="570" rx="27" ry="33" fill="#3a5068"/>
      <ellipse cx="958" cy="586" rx="16" ry="13" fill="#f08aa0"/>
      <path d="M800 470 C794 458 802 448 806 440 C812 450 818 460 812 470 C810 474 802 474 800 470 Z" fill="#a8dcff"/>
    </g>
