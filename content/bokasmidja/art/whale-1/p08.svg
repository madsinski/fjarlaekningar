    <circle cx="753" cy="779" r="8" fill="#fff6c8"/>
    <circle cx="820" cy="742" r="9" fill="#ff9a2e"/>
    <circle cx="700" cy="748" r="6" fill="#ff9a2e"/>
    <circle cx="772" cy="716" r="7" fill="#ffb347"/>
