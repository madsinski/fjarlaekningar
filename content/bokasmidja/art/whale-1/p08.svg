    <path d="M1084 790 L1076 768 M1090 790 L1088 768" fill="none" stroke="#f2c9a0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1075" cy="766" r="5" fill="#ffffff"/>
    <circle cx="1088" cy="766" r="5" fill="#ffffff"/>
    <circle cx="1074" cy="765" r="2" fill="#1d2b3a"/>
    <circle cx="1087" cy="765" r="2" fill="#1d2b3a"/>
  </g>
