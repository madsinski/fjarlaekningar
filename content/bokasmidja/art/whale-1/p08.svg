  <!-- foreground ledges -->
  <path d="M0 900 L0 800 C60 790 130 810 170 850 C190 870 200 886 204 900 Z" fill="#1e1420"/>
  <path d="M1200 900 L1200 790 C1140 780 1070 804 1030 846 C1012 866 1004 884 1000 900 Z" fill="#1e1420"/>
