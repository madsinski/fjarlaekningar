  </g>
  <!-- lava -->
  <path d="M-40 800 C80 770 180 812 300 790 C420 768 520 812 640 792 C760 772 880 812 1000 790 C1100 774 1180 800 1240 786 L1240 900 L-40 900 Z" fill="url(#lava)"/>
