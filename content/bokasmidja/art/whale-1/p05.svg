    <radialGradient id="warm" gradientUnits="userSpaceOnUse" cx="880" cy="480" r="760"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.3" stop-color="#ff9a3c" stop-opacity="0.95"/><stop offset="0.55" stop-color="#f0703a" stop-opacity="0.65"/><stop offset="0.8" stop-color="#c0607a" stop-opacity="0.25"/><stop offset="1" stop-color="#c0607a" stop-opacity="0"/></radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4a5a"/><stop offset="1" stop-color="#2c1f2c"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c3a70"/><stop offset="0.5" stop-color="#5a3558"/><stop offset="1" stop-color="#7a3a2c"/></linearGradient>
