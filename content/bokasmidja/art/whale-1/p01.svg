    <path d="M688 388 L666 378" fill="none" stroke="#fff6b0" stroke-width="6" stroke-linecap="round"/>
    <path d="M704 462 L694 482" fill="none" stroke="#fff6b0" stroke-width="6" stroke-linecap="round"/>
  </g>
