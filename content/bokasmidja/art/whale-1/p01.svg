    <path d="M740 440 C730 480 752 500 738 540" fill="none" stroke="#ffc1e0" stroke-width="7" stroke-linecap="round"/>
    <path d="M768 446 C760 490 782 515 768 562" fill="none" stroke="#ffd9ec" stroke-width="7" stroke-linecap="round"/>
    <path d="M796 446 C790 486 812 508 800 548" fill="none" stroke="#ffc1e0" stroke-width="7" stroke-linecap="round"/>
    <path d="M822 438 C822 472 842 490 834 524" fill="none" stroke="#ffd9ec" stroke-width="7" stroke-linecap="round"/>
    <path d="M716 430 C700 380 716 338 772 336 C830 336 852 386 842 432 C832 448 818 448 808 436 C798 450 782 450 772 438 C762 450 746 450 738 438 C730 446 720 442 716 430 Z" fill="url(#jelly)"/>
    <ellipse cx="760" cy="362" rx="26" ry="11" fill="#ffffff" opacity="0.5"/>
    <circle cx="768" cy="396" r="7" fill="#7a2f5c"/>
    <circle cx="806" cy="394" r="7" fill="#7a2f5c"/>
    <circle cx="770" cy="394" r="2" fill="#ffffff"/>
    <circle cx="808" cy="392" r="2" fill="#ffffff"/>
    <ellipse cx="788" cy="414" rx="6" ry="7" fill="#7a2f5c"/>
  </g>
