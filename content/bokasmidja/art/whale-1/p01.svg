  <g data-anim="swim">
    <polygon points="930,650 894,628 900,650 894,672" fill="#e2b21a"/>
    <ellipse cx="962" cy="650" rx="38" ry="23" fill="#ffd84a"/>
    <path d="M950 630 C960 612 976 614 980 632 Z" fill="#e2b21a"/>
    <circle cx="980" cy="645" r="8" fill="#ffffff"/>
    <circle cx="982" cy="646" r="4" fill="#1d2b3a"/>
    <path d="M984 660 C990 664 996 662 998 656" fill="none" stroke="#a67c00" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- bubbles -->
  <g data-anim="float">
    <circle cx="640" cy="230" r="16" fill="#ffffff" opacity="0.28"/>
    <circle cx="635" cy="225" r="5" fill="#ffffff" opacity="0.7"/>
    <circle cx="676" cy="180" r="10" fill="#ffffff" opacity="0.28"/>
    <circle cx="610" cy="150" r="7" fill="#ffffff" opacity="0.3"/>
  </g>
  <g>
    <circle cx="1080" cy="420" r="13" fill="#ffffff" opacity="0.28"/>
    <circle cx="1076" cy="416" r="4" fill="#ffffff" opacity="0.7"/>
    <circle cx="1108" cy="372" r="8" fill="#ffffff" opacity="0.3"/>
    <circle cx="420" cy="690" r="11" fill="#ffffff" opacity="0.28"/>
    <circle cx="446" cy="656" r="6" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- starfish -->
  <g data-anim="wiggle" data-tap="spin">
    <polygon points="520,812 529,836 554,837 534,853 541,878 520,864 499,878 506,853 486,837 511,836" fill="#ff8a5c" stroke="#ff8a5c" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="513" cy="845" r="4" fill="#7a2f1c"/>
    <circle cx="528" cy="845" r="4" fill="#7a2f1c"/>
    <path d="M513 855 C518 861 524 861 528 855" fill="none" stroke="#7a2f1c" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
