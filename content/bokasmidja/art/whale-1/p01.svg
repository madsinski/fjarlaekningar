<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5dbbe8"/><stop offset="0.5" stop-color="#2a86c4"/><stop offset="1" stop-color="#114a80"/></linearGradient>
    <linearGradient id="whaleBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f1f7fc"/><stop offset="1" stop-color="#c9dcec"/></linearGradient>
    <linearGradient id="whaleFin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#bcd2e6"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8d49a"/><stop offset="1" stop-color="#b99a5e"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6b0" stop-opacity="0.9"/><stop offset="0.5" stop-color="#ffd0e6" stop-opacity="0.4"/><stop offset="1" stop-color="#ffd0e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd5ec"/><stop offset="1" stop-color="#ff86bf"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sea)"/>
  <!-- light rays -->
  <polygon points="120,0 260,0 120,900 -120,900" fill="#ffffff" opacity="0.07"/>
  <polygon points="420,0 520,0 520,900 300,900" fill="#ffffff" opacity="0.06"/>
  <polygon points="760,0 900,0 1080,900 820,900" fill="#ffffff" opacity="0.07"/>
