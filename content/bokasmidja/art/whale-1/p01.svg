  <path d="M0 800 C160 750 300 790 440 800 C600 760 760 780 900 805 C1020 775 1120 780 1200 795 L1200 900 L0 900 Z" fill="#124f86"/>
  <!-- far little fish school -->
  <g data-anim="drift">
    <path d="M150 190 C165 178 185 178 198 190 L212 180 L212 200 L198 190 C185 202 165 202 150 190 Z" fill="#9fdcf7" opacity="0.8"/>
    <path d="M230 150 C245 138 265 138 278 150 L292 140 L292 160 L278 150 C265 162 245 162 230 150 Z" fill="#9fdcf7" opacity="0.8"/>
    <path d="M260 215 C275 203 295 203 308 215 L322 205 L322 225 L308 215 C295 227 275 227 260 215 Z" fill="#9fdcf7" opacity="0.8"/>
  </g>
  <!-- seaweed left -->
  <g data-anim="sway">
    <path d="M70 850 C40 770 100 730 66 640 C120 720 84 780 104 850 Z" fill="#2fae7d"/>
    <path d="M120 850 C100 790 150 760 128 700 C168 760 140 800 152 850 Z" fill="#48c78f"/>
    <path d="M30 850 C16 800 50 780 34 730 C66 780 46 810 58 850 Z" fill="#1f9468"/>
  </g>
  <!-- seaweed right -->
  <g>
    <path d="M1090 840 C1066 760 1124 720 1094 630 C1146 715 1108 770 1126 840 Z" fill="#2fae7d"/>
    <path d="M1140 840 C1124 790 1166 765 1148 715 C1182 765 1160 800 1170 840 Z" fill="#48c78f"/>
  </g>
