</g>
<!-- hero, looking up -->
<path d="M640 300 L650 262 M690 316 L716 284 M596 308 L586 272" fill="none" stroke="#fff0a0" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
<g transform="translate(238 512) rotate(-33) scale(0.44)">
