<circle cx="216" cy="580" r="24" fill="#b5d943"/><circle cx="210" cy="573" r="8" fill="#e6f07a"/>
<circle cx="262" cy="540" r="14" fill="#b5d943"/><circle cx="296" cy="500" r="9" fill="#b5d943"/><circle cx="316" cy="462" r="5" fill="#b5d943"/>
