<path d="M640 590 C620 650 580 700 520 725 C505 700 520 650 560 610 C585 588 615 580 640 590 Z" fill="url(#whaleFin)"/>
<ellipse cx="700" cy="298" rx="16" ry="6" fill="#9db7cf"/>
<ellipse cx="896" cy="522" rx="38" ry="24" fill="#f8b9c6" opacity="0.85"/><g data-anim="blink"><circle cx="880" cy="432" r="40" fill="#e3edf6"/><circle cx="882" cy="430" r="37" fill="#ffffff"/><circle cx="892" cy="420" r="22" fill="#1d2b3a"/><circle cx="900" cy="410" r="7" fill="#ffffff"/></g><path d="M840 366 C864 344 900 342 926 358" fill="none" stroke="#7d97b0" stroke-width="7" stroke-linecap="round"/><ellipse cx="972" cy="572" rx="15" ry="13" fill="#3a5068"/>

</g>
</g>
<!-- lava, far below -->
<g transform="translate(0 50)">
<path d="M-40 800 C80 770 180 812 300 790 C420 768 520 812 640 792 C760 772 880 812 1000 790 C1100 774 1180 800 1240 786 L1240 900 L-40 900 Z" fill="url(#lava)"/>
