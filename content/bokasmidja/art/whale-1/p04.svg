    <circle cx="696" cy="246" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="664" cy="196" r="8" fill="#ffe2a8" opacity="0.5"/>
    <circle cx="640" cy="690" r="9" fill="#ffe2a8" opacity="0.5"/>
    <circle cx="610" cy="640" r="6" fill="#ffe2a8" opacity="0.5"/>
