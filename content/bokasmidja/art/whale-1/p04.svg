        <circle cx="882" cy="434" r="35" fill="#ffffff"/>
        <circle cx="894" cy="438" r="24" fill="#1d2b3a"/>
        <circle cx="903" cy="427" r="9" fill="#ffffff"/>
        <circle cx="886" cy="450" r="4" fill="#ffffff"/>
