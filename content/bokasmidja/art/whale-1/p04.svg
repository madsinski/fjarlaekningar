<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a8fd0"/><stop offset="0.5" stop-color="#1f66a8"/><stop offset="1" stop-color="#0f3d74"/></linearGradient>
    <radialGradient id="warm" gradientUnits="userSpaceOnUse" cx="880" cy="480" r="760"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.3" stop-color="#ff9a3c" stop-opacity="0.95"/><stop offset="0.55" stop-color="#f0703a" stop-opacity="0.65"/><stop offset="0.8" stop-color="#c0607a" stop-opacity="0.25"/><stop offset="1" stop-color="#c0607a" stop-opacity="0"/></radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4a5a"/><stop offset="1" stop-color="#2c1f2c"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c3a70"/><stop offset="0.5" stop-color="#5a3558"/><stop offset="1" stop-color="#7a3a2c"/></linearGradient>
    <radialGradient id="hole" cx="0.6" cy="0.5" r="0.6"><stop offset="0" stop-color="#ffe08a"/><stop offset="0.3" stop-color="#ff9a3c"/><stop offset="0.7" stop-color="#e03a20"/><stop offset="1" stop-color="#8a1a14"/></radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/><stop offset="0.5" stop-color="#ff5a2a" stop-opacity="0.3"/><stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="whaleBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f1f7fc"/><stop offset="1" stop-color="#c9dcec"/></linearGradient>
    <linearGradient id="whaleFin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef5fb"/><stop offset="1" stop-color="#bcd2e6"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sea)"/>
  <rect width="1200" height="900" fill="url(#warm)"/>
  <!-- the mountain -->
  <path d="M440 900 C570 810 650 650 706 490 C746 376 806 226 884 116 L922 90 L952 108 L992 82 L1040 100 L1200 70 L1200 900 Z" fill="url(#rock)"/>
  <path d="M440 900 C570 810 650 650 706 490 C746 376 806 226 884 116 L906 101 C840 220 790 360 750 480 C700 640 620 800 500 900 Z" fill="#9a6468" opacity="0.7"/>
  <path d="M960 240 L1040 210 L1100 260 L1010 300 Z" fill="#7a5568" opacity="0.3"/>
  <path d="M1030 620 L1130 590 L1180 660 L1080 700 Z" fill="#7a5568" opacity="0.25"/>
  <path d="M700 760 L790 730 L850 790 L740 830 Z" fill="#7a5568" opacity="0.25"/>
