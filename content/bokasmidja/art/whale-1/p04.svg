      <path d="M842 376 C866 354 900 352 924 368" fill="none" stroke="#7d97b0" stroke-width="7" stroke-linecap="round"/>
      <path d="M892 566 C930 590 985 582 1012 540 C1012 610 920 650 892 566 Z" fill="#3a5068" stroke="#3a5068" stroke-width="8" stroke-linejoin="round"/>
      <path d="M918 598 C940 590 970 592 986 580 C972 610 940 622 918 598 Z" fill="#f08aa0"/>
    </g>
  </g>
  <!-- the crab's rock -->
  <path d="M250 900 C262 846 310 812 372 812 C420 790 500 792 546 820 C596 826 632 860 640 900 Z" fill="#3a2a3a"/>
  <path d="M300 838 C330 814 372 812 372 812 C420 790 500 792 546 820 C500 812 430 812 390 826 C356 824 326 830 300 838 Z" fill="#6a4a5a"/>
