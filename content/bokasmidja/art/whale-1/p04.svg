    <path d="M1020 732 L1028 710" fill="none" stroke="#f2c9a0" stroke-width="4" stroke-linecap="round"/>
    <path d="M1014 732 L1016 710" fill="none" stroke="#f2c9a0" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1029" cy="708" r="5" fill="#ffffff"/>
    <circle cx="1016" cy="708" r="5" fill="#ffffff"/>
    <circle cx="1028" cy="708" r="2" fill="#1d2b3a"/>
    <circle cx="1015" cy="708" r="2" fill="#1d2b3a"/>
